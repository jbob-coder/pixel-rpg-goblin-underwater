name: One-time Pixel RPG migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone canonical Pixel RPG source branch
        run: |
          git clone --branch pixel-rpg --single-branch https://github.com/jbob-coder/Chatgptjuegolpcal.git /tmp/pixel-rpg-source

      - name: Copy complete current snapshot while preserving temporary migration workflow
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/pixel-rpg-source/ ./
          git config user.name "Pixel RPG Migration"
          git config user.email "migration@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "migrate: Pixel RPG snapshot from b2021e043db88fac31beacfdca843c310e68bbee"
            git push origin HEAD:main
          fi
